<!doctype html>
<html>
  <head>
    <title>Contact Form</title>
    <meta name="description" content="Basic HTML Website." />
    <meta charset="UTF-8" />
  </head>

  <body>
    <header>
      <h1>Acme Support</h1>
      <nav>
        <ul>
          <li>Home</li>
          <li>Help</li>
          <li>Contact</li>
        </ul>
      </nav>
    </header>

    <hr />

    <main>
      <h2>Contact us</h2>
      <p>Send us a message and we will get back to you.</p>
      <form action="" method="post">
        <label for="full_name">Full name:</label>
        <input type="text" id="full_name" name="full_name" /><br />
        <label for="mail">Email</label>
        <input type="email" id="mail" name="mail" /><br />
        <label for="subject-select">Subject:</label>
        <select name="subject" id="subject-select">
          <option value="">Chose a topic</option>
          <option value="test">Topic 1</option>
          <option value="test">Topic 2</option>
          <option value="test">Topic 3</option>
          <option value="test">Topic 4</option>
        </select>
        <p>Message:</p>
        <textarea></textarea>
        <p>How did you hear about us ?</p>
        <input type="radio" id="search" />
        <label for="search">Search</label><br />
        <input type="radio" id="friend" />
        <label for="friend">Friend</label><br />
        <input type="radio" id="social_media" />
        <label for="social_media">Social media</label><br />
        <input type="checkbox" id="product_updates" />
        <label for="product_updates">Send me product updates</label><br />
        <button type="submit">Send message</button>
      </form>
    </main>

    <hr />

    <footer>
      <p>Author: Myself</p>
      <p>Copyright 2027 - Myself</p>
    </footer>
  </body>
</html>
