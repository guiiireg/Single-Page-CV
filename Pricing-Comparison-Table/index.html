<!doctype html>
<html>
  <head>
    <title>Pricing Comparison Table</title>

      property="og:description"
      content="Website to learn the tables basics."
    />

  <body>
    <h1>Acme Plans</h1>
    <header>
      <nav>
        <ul>
          <li>Home</li>
          <li>About</li>
          <li>Contact</li>
        </ul>
      </nav>
    </header>

    <main>
      <table>
        <caption>
          Plan comparison
        </caption>
        <thead>
          <tr>
            <th scope="col">Plan</th>
            <th scope="col">Storage</th>
            <th scope="col">Projects</th>
            <th scope="col">Support</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <th scope="row">Free</th>
            <td>5 GB</td>
            <td>3</td>
            <td>Email</td>
          </tr>
        </tbody>
        <tbody>
          <tr>
            <th scope="row">Pro</th>
            <td>100 GB</td>
            <td>25</td>
            <td>Priority Email</td>
          </tr>
        </tbody>
        <tbody>
          <tr>
            <th scope="row">Business</th>
            <td>1 TB</td>
            <td>Unlimited</td>
            <td>24/7 Phone</td>
          </tr>
        </tbody>
        <tfoot>
          <tr>
            <td colspan="4">All plans include SSL and daily backup</td>
          </tr>
        </tfoot>
      </table>
    </main>

    <footer>
      <p>Author: Myself</p>
